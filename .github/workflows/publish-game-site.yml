name: Publish mystery game site and host dashboard

on:
  workflow_dispatch:
    inputs:
      action:
        description: Choose whether the site should be live
        required: true
        type: choice
        options:
          - publish
          - unpublish
        default: publish

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: Check out the publisher repository
        uses: actions/checkout@v4

      - name: Check out private game content
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.GAME_CONTENT_REPO }}
          ref: main
          token: ${{ secrets.GAME_CONTENTS_READ_TOKEN }}
          path: game-content

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the PDF renderer
        if: inputs.action == 'publish'
        run: python -m pip install pymupdf

      - name: Install presentation converter when needed
        if: inputs.action == 'publish'
        run: |
          if find game-content/games -type f \( -iname '*.pptx' -o -iname '*.ppsx' -o -iname '*.odp' \) -print -quit | grep -q .; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y libreoffice-impress
          fi

      - name: Generate the website
        if: inputs.action == 'publish'
        env:
          APPS_SCRIPT_URL: ${{ vars.APPS_SCRIPT_URL }}
        run: >-
          python build_game_site.py
          --games-dir game-content/games
          --published-games-file game-content/published-games.txt
          --output-dir site
          --apps-script-url "$APPS_SCRIPT_URL"

      - name: Replace the live site with an unpublished notice
        if: inputs.action == 'unpublish'
        run: |
          rm -rf site
          mkdir -p site
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Temporarily unavailable</title></head>
          <body><main><h1>This game site is temporarily unavailable.</h1></main></body>
          </html>
          HTML

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the generated site
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify the uploaded Pages artifact is visible
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
        run: |
          if [[ -z "$PAGES_ARTIFACT_ID" ]]; then
            echo "::error::The upload step did not return a Pages artifact ID."
            exit 1
          fi

          artifact_endpoint="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages"
          for attempt in {1..6}; do
            artifact_ids=$(gh api "$artifact_endpoint" --jq '.artifacts[] | select(.expired == false) | .id')
            if grep -Fxq "$PAGES_ARTIFACT_ID" <<< "$artifact_ids"; then
              echo "Confirmed github-pages artifact ID $PAGES_ARTIFACT_ID."
              exit 0
            fi
            echo "Artifact $PAGES_ARTIFACT_ID is not listed yet (attempt $attempt of 6)."
            if [[ "$attempt" -lt 6 ]]; then
              sleep 5
            fi
          done
          echo "::error::GitHub accepted the upload, but its Actions API did not list artifact $PAGES_ARTIFACT_ID for this run."
          exit 1

      - name: Publish the site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show the organizer dashboard URL
        if: inputs.action == 'publish'
        run: |
          echo "Full game site: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Game and host links: ${{ steps.deployment.outputs.page_url }}host/" >> "$GITHUB_STEP_SUMMARY"
          echo "Each game has a setup page at host/<game-slug>/ and a monitoring page after Initiate. Team links open isolated station pages." >> "$GITHUB_STEP_SUMMARY"
